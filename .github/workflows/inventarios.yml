name: Sincronizar inventarios

# Publica el inventario de cada sucursal en S3 a partir del respaldo mas reciente
# que Eleventa deja en Dropbox. Corre en los servidores de GitHub, asi que no
# depende de que ninguna computadora de la empresa este encendida.

on:
  schedule:
    # 10:00 en Mexico. El pais no usa horario de verano desde 2022, asi que el
    # centro del pais es UTC-6 todo el año y esta hora no se desfasa.
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo probar, sin publicar en S3'
        type: boolean
        default: false
      sucursal:
        description: 'Una sola sucursal (leon, san-luis, aguascalientes). Vacio = todas'
        type: string
        default: ''

concurrency:
  group: sincronizar-inventarios
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci --omit=dev

      - name: Preparar Firebird en contenedor
        env:
          IMAGEN: jacobalberty/firebird:2.5-ss
        run: |
          set -e
          # Se usa un contenedor en lugar del paquete del sistema por dos
          # razones. Primero, el paquete de Debian corre el motor como el
          # usuario `firebird` y gbak fallaba con "Permission denied" sobre sus
          # carpetas. Segundo, los respaldos vienen de Firebird 2.0 y esta
          # imagen trae 2.5, que los lee sin riesgo de incompatibilidad, en vez
          # del 3.0 que trae Ubuntu.
          docker pull -q "$IMAGEN"

          echo "--- ubicacion de las herramientas dentro de la imagen ---"
          RUTA_GBAK=$(docker run --rm --entrypoint sh "$IMAGEN" -c \
            'command -v gbak || ls /usr/local/firebird/bin/gbak 2>/dev/null || find / -name gbak -type f 2>/dev/null | head -1')
          RUTA_ISQL=$(docker run --rm --entrypoint sh "$IMAGEN" -c \
            'command -v isql || ls /usr/local/firebird/bin/isql 2>/dev/null || find / -name isql -type f 2>/dev/null | head -1')
          echo "gbak: ${RUTA_GBAK:-NO ENCONTRADO}"
          echo "isql: ${RUTA_ISQL:-NO ENCONTRADO}"
          test -n "$RUTA_GBAK" && test -n "$RUTA_ISQL"

          # Envoltorios que ejecutan las herramientas dentro del contenedor.
          # Se monta /tmp en la misma ruta para que los argumentos del script
          # funcionen sin traducir, y se corre como root para que no haya
          # choques de permisos con los archivos temporales.
          crear_envoltorio() {
            sudo tee "/usr/local/bin/$1" >/dev/null <<ENVOLTORIO
          #!/bin/bash
          exec docker run --rm -u 0:0 -v /tmp:/tmp --entrypoint $2 $IMAGEN "\$@"
          ENVOLTORIO
            sudo chmod +x "/usr/local/bin/$1"
          }
          crear_envoltorio fb-gbak "$RUTA_GBAK"
          crear_envoltorio fb-isql "$RUTA_ISQL"

          echo "--- version que reportan los envoltorios ---"
          fb-gbak -z || true

          echo "--- prueba del motor antes de tocar los respaldos ---"
          mkdir -p /tmp/pruebafb && chmod 777 /tmp/pruebafb
          printf 'CREATE DATABASE "/tmp/pruebafb/prueba.fdb";\nSELECT 1 FROM RDB$DATABASE;\n' > /tmp/pruebafb/p.sql
          if fb-isql -user SYSDBA -password masterkey -i /tmp/pruebafb/p.sql; then
            echo "MOTOR FIREBIRD OK"
          else
            echo "MOTOR FIREBIRD NO RESPONDE"
            exit 1
          fi

      - name: Sincronizar
        env:
          # El script llama a estos en vez de buscar gbak e isql en el sistema
          GBAK: fb-gbak
          ISQL: fb-isql
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY:       ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET:    ${{ secrets.DROPBOX_APP_SECRET }}
          S3_BUCKET:             ${{ secrets.S3_BUCKET }}
          S3_REGION:             ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY:         ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY:         ${{ secrets.S3_SECRET_KEY }}
        run: |
          ARGS="--origen=dropbox"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.sucursal }}" ]; then ARGS="$ARGS --sucursal=${{ inputs.sucursal }}"; fi
          echo "Ejecutando: node scripts/sincronizar-inventarios.js $ARGS"
          node scripts/sincronizar-inventarios.js $ARGS

      - name: Guardar resultado de la prueba
        if: ${{ inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: inventarios-json
          path: scripts/out/
          if-no-files-found: warn
