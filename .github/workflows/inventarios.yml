name: Sincronizar inventarios

# Publica el inventario de cada sucursal en S3 a partir del respaldo mas reciente
# que Eleventa deja en Dropbox. Corre en los servidores de GitHub, asi que no
# depende de que ninguna computadora de la empresa este encendida.

on:
  schedule:
    # 10:00 en Mexico. El pais no usa horario de verano desde 2022, asi que el
    # centro del pais es UTC-6 todo el año y esta hora no se desfasa.
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo probar, sin publicar en S3'
        type: boolean
        default: false
      sucursal:
        description: 'Una sola sucursal (leon, san-luis, aguascalientes). Vacio = todas'
        type: string
        default: ''

concurrency:
  group: sincronizar-inventarios
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm ci --omit=dev

      - name: Preparar Firebird en contenedor
        env:
          IMAGEN: jacobalberty/firebird:2.5-ss
        run: |
          # Todo el bloque se canaliza a tee al final, en vez de redirigir con
          # exec. Con exec la salida se perdia cuando el paso fallaba, que es
          # justo cuando hace falta leerla.
          {
            # Se usa un contenedor en lugar del paquete del sistema por dos
            # razones. El paquete de Debian corre el motor como el usuario
            # `firebird` y gbak fallaba con "Permission denied". Y los respaldos
            # son de Firebird 2.0: esta imagen trae 2.5, que los lee sin riesgo,
            # en vez del 3.0 de Ubuntu.
            echo "=== imagen: $IMAGEN ==="
            docker pull -q "$IMAGEN" && echo "descarga correcta" || echo "FALLO LA DESCARGA"

            echo "=== que trae la imagen ==="
            docker run --rm --entrypoint sh "$IMAGEN" -c \
              'echo "PATH=$PATH"; echo "--- binarios de firebird ---"; find / -name "gbak*" -o -name "isql*" 2>/dev/null | head -20' \
              || echo "no se pudo inspeccionar la imagen"

            # El contenedor se deja ENCENDIDO con el servidor corriendo. En el
            # intento anterior se creaba uno nuevo por comando y fallaba con
            # "Unable to complete network request to host localhost": isql y
            # gbak hablan con un servidor Firebird, y en un contenedor efimero
            # no hay ninguno escuchando.
            echo "=== levantando el servidor ==="
            docker rm -f firebird >/dev/null 2>&1 || true
            docker run -d --name firebird -v /tmp:/tmp \
              -e ISC_PASSWORD=masterkey -e FIREBIRD_ROOT_PASSWORD=masterkey \
              "$IMAGEN" >/dev/null

            echo "=== esperando a que responda ==="
            listo=0
            for i in $(seq 1 30); do
              if docker exec firebird /usr/local/firebird/bin/isql -user SYSDBA -password masterkey \
                   -q -i /dev/null 2>/dev/null; then listo=1; break; fi
              sleep 2
            done
            docker logs firebird 2>&1 | tail -15
            echo "servidor listo: $listo (tras $((i*2))s)"

            # Envoltorios que ejecutan las herramientas DENTRO del contenedor
            # encendido. /tmp esta montado en la misma ruta, asi que los
            # argumentos del script funcionan sin traducir.
            for par in "fb-gbak:gbak" "fb-isql:isql"; do
              nombre="${par%%:*}"; bin="${par##*:}"
              printf '#!/bin/bash\nexec docker exec -u 0:0 firebird /usr/local/firebird/bin/%s "$@"\n' \
                "$bin" | sudo tee "/usr/local/bin/$nombre" >/dev/null
              sudo chmod +x "/usr/local/bin/$nombre"
            done

            echo "=== version ==="
            fb-gbak -z || true

            echo "=== prueba del motor ==="
            mkdir -p /tmp/pruebafb && chmod 777 /tmp/pruebafb
            printf 'CREATE DATABASE "/tmp/pruebafb/prueba.fdb";\nSELECT 1 FROM RDB$DATABASE;\n' > /tmp/pruebafb/p.sql
            if fb-isql -user SYSDBA -password masterkey -i /tmp/pruebafb/p.sql; then
              echo "MOTOR FIREBIRD OK"
            else
              echo "MOTOR FIREBIRD NO RESPONDE"
              exit 1
            fi
          } 2>&1 | tee -a /tmp/diagnostico.txt
          exit ${PIPESTATUS[0]}

      - name: Sincronizar
        env:
          # El script llama a estos en vez de buscar gbak e isql en el sistema
          GBAK: fb-gbak
          ISQL: fb-isql
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          DROPBOX_APP_KEY:       ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET:    ${{ secrets.DROPBOX_APP_SECRET }}
          S3_BUCKET:             ${{ secrets.S3_BUCKET }}
          S3_REGION:             ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY:         ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY:         ${{ secrets.S3_SECRET_KEY }}
        run: |
          ARGS="--origen=dropbox"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.sucursal }}" ]; then ARGS="$ARGS --sucursal=${{ inputs.sucursal }}"; fi
          echo "Ejecutando: node scripts/sincronizar-inventarios.js $ARGS"
          node scripts/sincronizar-inventarios.js $ARGS 2>&1 | tee -a /tmp/diagnostico.txt
          exit ${PIPESTATUS[0]}

      - name: Guardar resultado de la prueba
        if: ${{ inputs.dry_run == true }}
        uses: actions/upload-artifact@v4
        with:
          name: inventarios-json
          path: scripts/out/
          if-no-files-found: warn

      - name: Guardar diagnostico en S3
        if: always()
        env:
          S3_BUCKET:     ${{ secrets.S3_BUCKET }}
          S3_REGION:     ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
        run: |
          # Los registros de Actions necesitan autenticacion para leerse. Este
          # paso deja una copia en S3 para poder revisarla sin credenciales de
          # GitHub. No contiene credenciales: el script nunca las imprime.
          node scripts/subir-diagnostico.js /tmp/diagnostico.txt || true
