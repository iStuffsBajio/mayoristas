<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icono de pestaña. Se usa solo la salpicadura del logotipo: a 32 px el
         texto "iSTUFFS CUSTOM CASES" es ilegible y se ve como una mancha. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icono-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#D51A7A" />
    <!-- Le dice al navegador que la pagina maneja sus propios colores. Sin
         esto, Chrome en Android la oscurece por su cuenta con el modo oscuro
         del sistema y el diseno se ve invertido y sucio. -->
    <meta name="color-scheme" content="light" />

    <!-- El título es lo que Google enseña en azul y lo que la gente busca.
         No dice «mayoristas» a propósito: la página va a ser también tienda
         en línea, y quien no sepa si puede comprar ahí no debe descartarla
         al leer el resultado. «Bajío» sí va, porque es como la buscan. -->
    <title>iStuffs Bajío · Fundas y accesorios para celular</title>
    <meta name="description" content="Fundas, micas y accesorios para celular en León, San Luis Potosí y Aguascalientes. Consulta existencias y haz tu pedido por WhatsApp a cualquier hora." />

    <!-- Cuál es la dirección buena. El dominio viejo de Amplify sirve lo
         mismo, y sin esto Google ve dos sitios idénticos y reparte entre los
         dos en vez de posicionar uno. -->
    <link rel="canonical" href="https://istuffsbajio.com/" />

    <!-- Vista previa al compartir el enlace por WhatsApp y redes -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="iStuffs Bajío · Fundas y accesorios para celular" />
    <meta property="og:description" content="Consulta existencias y manda tu pedido a cualquier hora. Que un horario no detenga tu venta." />
    <meta property="og:url" content="https://istuffsbajio.com/" />
    <!-- La imagen va al dominio propio. Apuntaba al de Amplify, así que la
         vista previa de WhatsApp dependía de una dirección que algún día se
         apaga. -->
    <meta property="og:image" content="https://istuffsbajio.com/logo-istuffs.png" />
    <meta property="og:locale" content="es_MX" />
    <meta name="twitter:card" content="summary" />

    <!-- Quiénes somos, en el formato que los buscadores entienden sin leer
         el diseño. Una entrada por tienda, con la dirección tal como está en
         su ficha de Google: el nombre, la dirección y el teléfono tienen que
         coincidir letra por letra con la ficha, porque Google los compara
         para decidir si el sitio y el negocio son el mismo. Si no coinciden,
         reparte la fuerza en vez de sumarla.

         Los nombres son los de las fichas reales, que hoy son tres
         distintos. No se unifican aquí: cambiar el nombre de una ficha con
         años de historial es decisión del dueño y puede costar posición. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "iStuffs Bajío",
      "alternateName": ["iStuffs", "iStuffs Custom Cases", "iStuffs Fundas Personalizadas"],
      "url": "https://istuffsbajio.com",
      "logo": "https://istuffsbajio.com/logo-istuffs.png",
      "description": "Fundas, micas y accesorios para celular en León, San Luis Potosí y Aguascalientes. Venta al mayoreo y menudeo, fundas personalizadas e impresión de stickers.",
      "subOrganization": [
        {
          "@type": "Store",
          "name": "iStuffs Leon Fundas Personalizadas",
          "url": "https://istuffsbajio.com",
          "image": "https://istuffsbajio.com/logo-istuffs.png",
          "telephone": "+52-477-663-9890",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "5 de Mayo 216, Local 40 Planta Baja",
            "addressLocality": "León",
            "addressRegion": "Guanajuato",
            "postalCode": "37000",
            "addressCountry": "MX"
          },
          "openingHoursSpecification": [{
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
            "opens": "10:30", "closes": "20:00"
          }]
        },
        {
          "@type": "Store",
          "name": "ISTUFFS FUNDAS PERSONALIZADAS SLP",
          "url": "https://istuffsbajio.com",
          "image": "https://istuffsbajio.com/logo-istuffs.png",
          "telephone": "+52-444-501-1007",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Álvaro Obregón 457, interior 403 planta baja",
            "addressLocality": "San Luis Potosí",
            "addressRegion": "San Luis Potosí",
            "postalCode": "78000",
            "addressCountry": "MX"
          },
          "openingHoursSpecification": [{
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
            "opens": "10:30", "closes": "20:00"
          }]
        },
        {
          "@type": "Store",
          "name": "iStuffs Aguascalientes",
          "url": "https://istuffsbajio.com",
          "image": "https://istuffsbajio.com/logo-istuffs.png",
          "telephone": "+52-449-394-6507",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "5 de Mayo 219, Zona Centro",
            "addressLocality": "Aguascalientes",
            "addressRegion": "Aguascalientes",
            "postalCode": "20000",
            "addressCountry": "MX"
          },
          "openingHoursSpecification": [{
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
            "opens": "10:30", "closes": "20:00"
          }]
        }
      ]
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Una sola familia: Inter, en cuatro grosores. Es la neutra que usan
         las tiendas de tecnologia; no tiene caracter propio a proposito, para
         que lo ponga el producto y el color de la marca.
         El enlace va DESPUES de los preconnect, que es lo que los hace servir
         de algo. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Contenido dentro de #root. React lo reemplaza al montar, pero existe
         para quien lee el HTML sin ejecutar JavaScript: los buscadores en su
         primera pasada, y el lector de pantalla mientras carga.

         Sin esto el cuerpo llegaba literalmente vacío. Google sí ejecuta
         JavaScript, pero en una segunda vuelta que puede tardar semanas en un
         dominio recién creado. Esto le da algo que leer de inmediato.

         De paso sirve de pantalla de carga: se ve el nombre en vez de un
         blanco, que es lo que había. -->
    <div id="root">
      <div style="min-height:60vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center">
        <div style="max-width:620px">
          <h1 style="font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-0.03em;color:#101619;margin:0 0 14px">
            iStuffs Bajío
          </h1>
          <p style="font-size:17px;line-height:1.5;color:rgba(16,22,25,0.66);margin:0 0 10px">
            Fundas, micas y accesorios para celular al mayoreo y menudeo en
            León, San Luis Potosí y Aguascalientes.
          </p>
          <p style="font-size:15px;line-height:1.5;color:rgba(16,22,25,0.55);margin:0">
            Consulta las existencias de cada sucursal y manda tu pedido por
            WhatsApp a cualquier hora. También personalizamos fundas con tu
            diseño e imprimimos stickers.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
