<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icono de pestaña. Se usa solo la salpicadura del logotipo: a 32 px el
         texto "iSTUFFS CUSTOM CASES" es ilegible y se ve como una mancha. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icono-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#D51A7A" />
    <!-- Le dice al navegador que la pagina maneja sus propios colores. Sin
         esto, Chrome en Android la oscurece por su cuenta con el modo oscuro
         del sistema y el diseno se ve invertido y sucio. -->
    <meta name="color-scheme" content="light" />

    <title>iStuffs · Portal de Mayoristas</title>
    <meta name="description" content="Consulta existencias de León, San Luis Potosí y Aguascalientes, y manda tu pedido por WhatsApp a cualquier hora." />

    <!-- Vista previa al compartir el enlace por WhatsApp y redes -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="iStuffs · Portal de Mayoristas" />
    <meta property="og:description" content="Consulta existencias y manda tu pedido a cualquier hora. Que un horario no detenga tu venta." />
    <meta property="og:image" content="https://main.d25h6vktoh9i8v.amplifyapp.com/logo-istuffs.png" />
    <meta property="og:locale" content="es_MX" />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
